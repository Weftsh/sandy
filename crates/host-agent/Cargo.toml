[package]
name = "weft-host-agent"
description = "Runs Weft sandboxes on one EC2 host: Firecracker microVMs, per-sandbox networking, egress interception and the data-path tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "weft-host-agent"
path = "src/main.rs"

[dependencies]
weft-netpolicy = { path = "../netpolicy" }
weft-awsauth = { path = "../awsauth" }

anyhow = "1"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
nix = { version = "0.31", features = ["socket", "net", "mount", "signal", "process", "user", "fs"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "query"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
