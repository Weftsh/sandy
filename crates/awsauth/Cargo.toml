[package]
name = "weft-awsauth"
description = "AWS IAM authentication of Weft internal services (hosts, egress gateway) to the control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
aws-config = { version = "1.8", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-credential-types = "1.2"
aws-sigv4 = { version = "1.3", default-features = false, features = ["sign-http"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
hex = "0.4"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
