# Signed release of Weft Sandboxes.
#
# On a v* tag: test; build the guest and host binaries, the container images,
# the custom-resource Lambdas and the host AMI; sign everything keylessly with
# Sigstore (GitHub Actions OIDC identity of this workflow); and publish the
# CloudFormation template, the signed release manifest and the Lambda bundles
# to the per-Region release buckets.
#
# The stack's verify-release custom resource accepts a release only if
# release-manifest.json carries a Sigstore signature whose certificate
# identity is exactly
#   https://github.com/Weftsh/sandy/.github/workflows/release.yml@refs/tags/v<version>
# so this file's path and the tag format are part of the trust chain.
#
# Repository settings used:
#   vars.RELEASE_ROLE_ARN        IAM role assumed through GitHub OIDC (no static keys)
#   vars.RELEASE_REGIONS         space-separated Regions with an AMI and a release bucket
#   vars.RELEASE_BUCKET_PREFIX   buckets are <prefix>-<region>
#   vars.PACKER_SUBNET_ID        optional subnet for the AMI build instance
#   environment "release"        protection rules (reviewers) for the AWS jobs
#
# No caches are used: a release is built from a clean slate.

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE_REPOSITORY_PREFIX: ghcr.io/weftsh
  RELEASE_REGIONS: ${{ vars.RELEASE_REGIONS || 'us-east-1 us-east-2 us-west-2 eu-west-1 eu-central-1' }}
  RELEASE_BUCKET_PREFIX: ${{ vars.RELEASE_BUCKET_PREFIX || 'weft-sandboxes-releases' }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_region: ${{ steps.version.outputs.build_region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag $TAG is not v<semver>"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          for manifest in packages/*/package.json; do
            v="$(jq -r .version "$manifest")"
            [[ "$v" == "$version" ]] || { echo "::error::$manifest is version $v, tag is $version"; exit 1; }
          done
          [[ "$cargo_version" == "$version" ]] || { echo "::error::Cargo.toml is version $cargo_version, tag is $version"; exit 1; }
          read -r -a regions <<<"$RELEASE_REGIONS"
          (( ${#regions[@]} > 0 )) || { echo "::error::RELEASE_REGIONS is empty"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build_region=${regions[0]}" >>"$GITHUB_OUTPUT"

      - name: Release signing identity matches the verifier
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          expected="$(sed -n 's/^export const RELEASE_REPOSITORY = "\(.*\)";$/\1/p' deploy/cloudformation/functions/src/verify-release/manifest.ts)"
          if [[ "$REPOSITORY" != "$expected" ]]; then
            echo "::error::stacks only trust releases signed by $expected; this repository is $REPOSITORY"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # A release without license verification keys could not validate any
      # customer's license; refuse to build one.
      - name: License signing keys are present
        run: |
          node --experimental-strip-types --no-warnings -e '
            import("./packages/license/src/trusted-keys.ts").then((m) => {
              const n = Object.keys(m.RELEASE_SIGNING_KEYS).length;
              if (n === 0) {
                console.error("::error::RELEASE_SIGNING_KEYS in packages/license/src/trusted-keys.ts is empty");
                process.exit(1);
              }
              console.log(n + " license signing key(s)");
            });'

  test:
    name: Test
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: TypeScript packages
        run: |
          pnpm install --frozen-lockfile
          pnpm -r run build
          pnpm -r run typecheck
          pnpm test

      - name: Rust workspace
        run: |
          rustup show active-toolchain
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Custom-resource Lambdas
        working-directory: deploy/cloudformation/functions
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test

      - name: Template and host image lint
        run: |
          python3 -m pip install --user --quiet cfn-lint==1.57.0
          cfn-lint --include-checks I -- deploy/cloudformation/weft-sandboxes.yaml
          python3 -m unittest discover -s deploy/cloudformation/scripts
          shellcheck -x deploy/packer/scripts/*.sh deploy/packer/files/bin/*

  binaries:
    name: Guest and host binaries
    needs: [preflight, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # check out the repository
      id-token: write # Sigstore signing of the build provenance
      attestations: write # store build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: weft-guest-init (static musl)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --locked -p weft-guest-init --target x86_64-unknown-linux-musl
          install -D -m 0755 target/x86_64-unknown-linux-musl/release/weft-guest-init dist/guest/weft-guest-init
          file dist/guest/weft-guest-init | grep -Eq 'statically linked|static-pie linked' || {
            echo "::error::weft-guest-init is not statically linked"; file dist/guest/weft-guest-init; exit 1; }

      # envd is built from the pinned upstream revision; the script checks
      # the result against the pinned SHA-256 in guest/envd/VERSION.
      - name: envd
        run: guest/envd/build.sh dist/guest

      - name: Guest kernel
        run: |
          sudo apt-get install -y -q --no-install-recommends bc bison flex libelf-dev libssl-dev dwarves
          guest/kernel/build.sh dist/guest
          test -s dist/guest/vmlinux

      # Built in Amazon Linux 2023 so the binary links against the same glibc
      # the host AMI has.
      - name: weft-host-agent (Amazon Linux 2023)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e CARGO_TERM_COLOR=never -e CARGO_INCREMENTAL=0 \
            amazonlinux:2023@sha256:74c545e3e04db388b00bd31d7cc5640d4e9c12058a6d72af938d113da3c82893 \
            bash -euo pipefail -c '
              dnf -y -q install gcc gcc-c++ make cmake tar gzip findutils
              curl --proto "=https" --tlsv1.2 -fsSL -o /tmp/rustup-init \
                https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
              echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/rustup-init" | sha256sum -c -
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y -q --profile minimal --default-toolchain none
              . "$HOME/.cargo/env"
              cargo build --release --locked -p weft-host-agent --target-dir /tmp/target-al2023
              install -D -m 0755 /tmp/target-al2023/release/weft-host-agent dist/bin/weft-host-agent
              chown -R "'"$(id -u):$(id -g)"'" dist'
          dist/bin/weft-host-agent --version

      - name: Checksums
        run: |
          (cd dist && find bin guest -type f -print0 | sort -z | xargs -0 sha256sum) | tee dist/SHA256SUMS

      - name: SBOM (binaries and their locked dependencies)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom-binaries.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/bin/weft-host-agent
            dist/guest/weft-guest-init
            dist/guest/envd
            dist/guest/vmlinux

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Image ${{ matrix.name }}
    needs: [preflight, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signatures and provenance
      attestations: write # store build provenance attestations
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: sandbox-control-plane
            component: control-plane
            dockerfile: packages/control-plane/Dockerfile
          - name: sandbox-egress-gateway
            component: egress-gateway
            dockerfile: crates/egress-gateway/Dockerfile
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      IMAGE: ${{ format('ghcr.io/weftsh/{0}', matrix.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
          # Provenance and SBOM are attached below as signed attestations.
          provenance: false
          sbom: false
          no-cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach signed SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: cosign attest --yes --type spdxjson --predicate "sbom-${COMPONENT}.spdx.json" "${IMAGE}@${DIGEST}"

      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p image-out
          jq -n --arg repository "$IMAGE" --arg digest "$DIGEST" '{repository: $repository, digest: $digest}' \
            >"image-out/${COMPONENT}.json"
          mv "sbom-${COMPONENT}.spdx.json" image-out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.component }}
          path: image-out/
          if-no-files-found: error
          retention-days: 7

  functions:
    name: Custom-resource Lambdas
    needs: [preflight, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
      id-token: write # Sigstore signing of the build provenance
      attestations: write # store build provenance attestations
    defaults:
      run:
        working-directory: deploy/cloudformation/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: deploy/cloudformation/functions/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The Sigstore trusted root (through TUF) is bundled with verify-release
      # so stacks verify signatures without contacting Sigstore.
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run fetch-trusted-root
          pnpm run build

      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: deploy/cloudformation/functions/dist/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functions
          path: deploy/cloudformation/functions/dist/
          if-no-files-found: error
          retention-days: 7

  ami:
    name: Host AMI
    needs: [preflight, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read # check out the repository
      id-token: write # AWS credentials through GitHub OIDC
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_REGION: ${{ needs.preflight.outputs.build_region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}
          role-session-name: weft-release-ami-${{ github.run_id }}
          aws-region: ${{ needs.preflight.outputs.build_region }}
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.1"

      # AMIs stay private in every Region. Weft's license service grants
      # launch permission to licensed accounts; this workflow never shares.
      - name: Build and copy the AMI
        env:
          GIT_COMMIT: ${{ github.sha }}
          PACKER_SUBNET_ID: ${{ vars.PACKER_SUBNET_ID }}
        run: |
          read -r -a regions <<<"$RELEASE_REGIONS"
          copies="$(printf '%s\n' "${regions[@]:1}" | jq -R . | jq -sc .)"
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          args=(
            -var "version=$VERSION"
            -var "git_commit=$GIT_COMMIT"
            -var "region=$BUILD_REGION"
            -var "ami_regions=$copies"
            -var "manifest_path=$PWD/packer-manifest.json"
            -var "host_agent_path=$PWD/dist/bin/weft-host-agent"
            -var "host_agent_sha256=$(sha dist/bin/weft-host-agent)"
            -var "guest_init_path=$PWD/dist/guest/weft-guest-init"
            -var "guest_init_sha256=$(sha dist/guest/weft-guest-init)"
            -var "envd_path=$PWD/dist/guest/envd"
            -var "envd_sha256=$(sha dist/guest/envd)"
            -var "envd_license_path=$PWD/dist/guest/envd.LICENSE"
            -var "vmlinux_path=$PWD/dist/guest/vmlinux"
            -var "vmlinux_sha256=$(sha dist/guest/vmlinux)"
          )
          if [[ -n "$PACKER_SUBNET_ID" ]]; then
            args+=(-var "subnet_id=$PACKER_SUBNET_ID")
          fi
          packer init deploy/packer
          packer validate "${args[@]}" deploy/packer
          packer build -color=false "${args[@]}" deploy/packer

      - name: AMI IDs per Region
        run: |
          jq '.builds[-1].artifact_id | split(",") | map(split(":") | {(.[0]): .[1]}) | add' \
            packer-manifest.json | tee amis.json
          read -r -a regions <<<"$RELEASE_REGIONS"
          for r in "${regions[@]}"; do
            jq -e --arg r "$r" '.[$r] | test("^ami-[0-9a-f]+$")' amis.json >/dev/null ||
              { echo "::error::no AMI for $r"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amis
          path: |
            amis.json
            packer-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: [preflight, binaries, images, functions, ami]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # GitHub release
      id-token: write # keyless signature of the manifest, provenance, AWS OIDC
      attestations: write # store build provenance attestations
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_REGION: ${{ needs.preflight.outputs.build_region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Render the template
        run: |
          mkdir -p release/functions
          cp artifacts/functions/*.zip release/functions/
          python3 deploy/cloudformation/scripts/render_release_template.py \
            --template deploy/cloudformation/weft-sandboxes.yaml \
            --version "$VERSION" \
            --control-plane-image "$(jq -r '.repository + "@" + .digest' artifacts/image-control-plane/control-plane.json)" \
            --gateway-image "$(jq -r '.repository + "@" + .digest' artifacts/image-egress-gateway/egress-gateway.json)" \
            --amis artifacts/amis/amis.json \
            --bootstrap-templates "base=${IMAGE_REPOSITORY_PREFIX}/sandbox-base:${VERSION}" \
            --out release/weft-sandboxes.yaml
          python3 -m pip install --user --quiet cfn-lint==1.57.0
          cfn-lint --include-checks I -- release/weft-sandboxes.yaml

      - name: Write the release manifest
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          fc_tgz_sha256="$(sed -n 's/^firecracker_tgz_sha256 *= *"\(.*\)"$/\1/p' deploy/packer/firecracker.auto.pkrvars.hcl)"
          fc_version="$(sed -n 's/^firecracker_version *= *"\(.*\)"$/\1/p' deploy/packer/firecracker.auto.pkrvars.hcl)"
          artifact() { jq -n --arg sha "$(sha256sum "$1" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$1")" '{sha256: $sha, size: $size}'; }
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GIT_COMMIT" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile amis artifacts/amis/amis.json \
            --slurpfile cp artifacts/image-control-plane/control-plane.json \
            --slurpfile gw artifacts/image-egress-gateway/egress-gateway.json \
            --argjson template "$(artifact release/weft-sandboxes.yaml)" \
            --argjson verify "$(artifact release/functions/verify-release.zip)" \
            --argjson ca "$(artifact release/functions/egress-ca.zip)" \
            --argjson cleanup "$(artifact release/functions/cleanup.zip)" \
            --argjson agent "$(artifact artifacts/binaries/bin/weft-host-agent)" \
            --argjson init "$(artifact artifacts/binaries/guest/weft-guest-init)" \
            --argjson envd "$(artifact artifacts/binaries/guest/envd)" \
            --argjson vmlinux "$(artifact artifacts/binaries/guest/vmlinux)" \
            --arg fcname "firecracker-v${fc_version}-x86_64.tgz" \
            --arg fcsha "$fc_tgz_sha256" \
            '{
              schemaVersion: 1,
              product: "weft-sandboxes",
              version: $version,
              gitCommit: $commit,
              createdAt: $created,
              amis: $amis[0],
              images: { "control-plane": $cp[0], "egress-gateway": $gw[0] },
              artifacts: {
                "weft-sandboxes.yaml": $template,
                "functions/verify-release.zip": $verify,
                "functions/egress-ca.zip": $ca,
                "functions/cleanup.zip": $cleanup,
                "bin/weft-host-agent": $agent,
                "guest/weft-guest-init": $init,
                "guest/envd": $envd,
                "guest/vmlinux": $vmlinux,
                ($fcname): { sha256: $fcsha }
              }
            }' >release/release-manifest.json
          cat release/release-manifest.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the manifest (keyless) and verify the signature
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd release
          cosign sign-blob --yes --bundle release-manifest.json.sigstore.json release-manifest.json
          cosign verify-blob \
            --bundle release-manifest.json.sigstore.json \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-manifest.json

      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/weft-sandboxes.yaml
            release/release-manifest.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}
          role-session-name: weft-release-publish-${{ github.run_id }}
          aws-region: ${{ needs.preflight.outputs.build_region }}

      # Published releases are immutable: refuse to overwrite a version.
      - name: Upload to the release buckets
        run: |
          read -r -a regions <<<"$RELEASE_REGIONS"
          for region in "${regions[@]}"; do
            bucket="${RELEASE_BUCKET_PREFIX}-${region}"
            if aws s3api head-object --region "$region" --bucket "$bucket" --key "v${VERSION}/release-manifest.json" >/dev/null 2>&1; then
              echo "::error::s3://${bucket}/v${VERSION}/ already exists; releases are never overwritten"
              exit 1
            fi
          done
          for region in "${regions[@]}"; do
            bucket="${RELEASE_BUCKET_PREFIX}-${region}"
            # Manifest and signature last, so a partially uploaded release
            # never verifies.
            aws s3 cp --region "$region" --only-show-errors --recursive release/functions "s3://${bucket}/v${VERSION}/functions/"
            aws s3 cp --region "$region" --only-show-errors release/weft-sandboxes.yaml "s3://${bucket}/v${VERSION}/weft-sandboxes.yaml"
            aws s3 cp --region "$region" --only-show-errors release/release-manifest.json.sigstore.json "s3://${bucket}/v${VERSION}/release-manifest.json.sigstore.json"
            aws s3 cp --region "$region" --only-show-errors release/release-manifest.json "s3://${bucket}/v${VERSION}/release-manifest.json"
            echo "published s3://${bucket}/v${VERSION}/"
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp artifacts/binaries/SHA256SUMS release/SHA256SUMS-binaries
          cp artifacts/binaries/sbom-binaries.spdx.json release/
          cp artifacts/image-control-plane/sbom-control-plane.spdx.json artifacts/image-egress-gateway/sbom-egress-gateway.spdx.json release/
          read -r -a regions <<<"$RELEASE_REGIONS"
          {
            echo "## Install"
            echo
            for region in "${regions[@]}"; do
              url="https://${RELEASE_BUCKET_PREFIX}-${region}.s3.${region}.amazonaws.com/v${VERSION}/weft-sandboxes.yaml"
              echo "- ${region}: [Launch Stack](https://console.aws.amazon.com/cloudformation/home?region=${region}#/stacks/create/review?templateURL=${url}&stackName=weft-sandboxes)"
            done
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "cosign verify-blob --bundle release-manifest.json.sigstore.json \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com release-manifest.json"
            echo '```'
          } >release-notes.md
          gh release create "$TAG" --verify-tag --title "Weft Sandboxes ${VERSION}" --notes-file release-notes.md \
            release/weft-sandboxes.yaml \
            release/release-manifest.json \
            release/release-manifest.json.sigstore.json \
            release/SHA256SUMS-binaries \
            release/*.spdx.json \
            release/functions/*.zip
