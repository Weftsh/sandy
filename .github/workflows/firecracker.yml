# End-to-end tests on real Firecracker microVMs.
#
# GitHub's Linux runners expose /dev/kvm, so this job runs the development
# stack with `--firecracker`: every sandbox is a Firecracker microVM started
# through the jailer, with the guest kernel from guest/kernel/, exactly as on
# a production host. It runs the E2B SDK compatibility suite and the full
# escape-attempt suite, including the microVM boundary checks.
#
# The guest kernel takes about 20 minutes to build, so it is cached by the
# hash of guest/kernel/. Releases never use this cache (see release.yml).
name: Firecracker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecracker-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: E2B compatibility and escape suites (Firecracker)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host
        run: |
          ls -l /dev/kvm
          nproc && free -m
          stat -fc %T /sys/fs/cgroup
          uname -r
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q iproute2 iptables e2fsprogs \
            build-essential bc bison flex libelf-dev libssl-dev xz-utils
      - name: Restore the guest kernel
        id: kernel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/guest/vmlinux
            dist/guest/vmlinux.config
          key: guest-kernel-${{ hashFiles('guest/kernel/**') }}
      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-musl
          scripts/dev-stack.sh build --firecracker
      # Saved right away, so a failure later in the job keeps the kernel.
      - name: Save the guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/guest/vmlinux
            dist/guest/vmlinux.config
          key: guest-kernel-${{ hashFiles('guest/kernel/**') }}
      - name: Start the stack (Firecracker)
        run: sudo -E env "PATH=$PATH" scripts/dev-stack.sh up --no-build --firecracker
      - name: E2B compatibility suite (unmodified SDKs)
        run: |
          sudo chown -R "$USER" .weft
          set -a; . .weft/dev/e2b.env; set +a
          packages/compat-tests/run.sh
      - name: Escape-attempt suite (network and microVM boundary)
        run: |
          set -a; . .weft/dev/e2b.env; set +a
          .weft/compat-venv/bin/pytest -q -rs tests/escape
      - name: Host checks on running microVMs (jailer, UIDs, seccomp)
        run: |
          set -a; . .weft/dev/e2b.env; set +a
          .weft/compat-venv/bin/python - <<'EOF'
          import subprocess
          from e2b import Sandbox
          boxes = [Sandbox.create() for _ in range(2)]
          try:
              subprocess.run(["sudo", "tests/escape/host_checks.sh"], check=True)
          finally:
              for box in boxes:
                  box.kill()
          EOF
      - name: Logs
        if: always()
        run: |
          sudo sh -c 'tail -n 300 .weft/dev/*.log' || true
          sudo find /var/lib/weft-dev -maxdepth 5 -printf '%M %u %s %p\n' 2>/dev/null | head -n 100 || true
          sudo dmesg | tail -n 50 || true
      - name: Stop the stack
        if: always()
        run: |
          sudo scripts/dev-stack.sh down || true
          mkdir -p logs
          sudo sh -c 'cp .weft/dev/*.log logs/' || true
          sudo chown -R "$USER" logs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: firecracker-reports
          path: |
            packages/compat-tests/reports/
            logs/
          retention-days: 14
