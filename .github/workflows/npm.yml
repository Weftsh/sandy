# Publishes @weftsh/sandbox (packages/sdk) to npm, with provenance.
#
# To release, bump the version in packages/sdk/package.json and merge to main.
# On main, this workflow publishes the version if npm does not have it yet and
# does nothing otherwise. Pre-release versions (1.2.0-beta.1) go to the "next"
# dist-tag, everything else to "latest". Pull requests build, test and pack
# the package without publishing. Running it by hand on main retries a publish.
#
# Uses the NPM_TOKEN secret: an npm token that can publish to the @weftsh
# scope. Published versions are never overwritten.
name: npm

on:
  push:
    branches: [main]
    paths: ["packages/sdk/**", ".github/workflows/npm.yml"]
  pull_request:
    paths: ["packages/sdk/**", ".github/workflows/npm.yml"]
  workflow_dispatch:

permissions: {}

# Publishes run one at a time; a queued run finds the version already out.
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @weftsh/sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      id-token: write # npm provenance
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @weftsh/sandbox run build
          pnpm --filter @weftsh/sandbox run typecheck
          pnpm --filter @weftsh/sandbox test

      - name: Pack
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Check the version
        id: version
        working-directory: packages/sdk
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          # Ask the registry directly: only a 404 means "not published".
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            "https://registry.npmjs.org/@weftsh%2fsandbox/${version}")"
          case "$status" in
            200)
              echo "::notice::@weftsh/sandbox@${version} is already on npm; nothing to publish"
              new=false ;;
            404)
              echo "@weftsh/sandbox@${version} is not on npm yet (dist-tag ${tag})"
              new=true ;;
            *)
              echo "::error::npm registry answered HTTP ${status}"
              exit 1 ;;
          esac
          { echo "version=${version}"; echo "tag=${tag}"; echo "new=${new}"; } >>"$GITHUB_OUTPUT"

      - name: Publish
        if: env.PUBLISH == 'true' && steps.version.outputs.new == 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN secret is not available to this repository"
            exit 1
          fi
          echo "npm user: $(npm whoami)"
          npm publish --provenance --tag "$TAG"
