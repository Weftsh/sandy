# Publishes @weftsh/sandbox (packages/sdk) to npm, with provenance.
#
# To publish, set the version in packages/sdk/package.json, then push a tag
# that matches it:
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
# Run by hand (Actions > npm > Run workflow), it is a dry run: it checks the
# token, builds, tests and packs, and publishes nothing.
#
# Uses the NPM_TOKEN secret: an npm token that can publish to the @weftsh
# scope. Published versions are never overwritten.
name: npm

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @weftsh/sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      id-token: write # npm provenance
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @weftsh/sandbox run build
          pnpm --filter @weftsh/sandbox run typecheck
          pnpm --filter @weftsh/sandbox test

      - name: Check the version
        working-directory: packages/sdk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$DRY_RUN" = false ] && [ "$TAG" != "sdk-v${version}" ]; then
            echo "::error::tag ${TAG} does not match packages/sdk/package.json version ${version}"
            exit 1
          fi
          if npm view "@weftsh/sandbox@${version}" version >/dev/null 2>&1; then
            if [ "$DRY_RUN" = false ]; then
              echo "::error::@weftsh/sandbox@${version} is already published; bump the version"
              exit 1
            fi
            echo "::notice::@weftsh/sandbox@${version} is already published"
          fi
          echo "@weftsh/sandbox ${version}"

      - name: Check the token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPM_TOKEN secret is not available to this repository"
            exit 1
          fi
          echo "npm user: $(npm whoami)"

      - name: Publish
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --dry-run
          else
            npm publish --provenance
          fi
