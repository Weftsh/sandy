# Publishes @weftsh/sandbox (packages/sdk) to npm, with provenance.
#
# To release, bump the version in packages/sdk/package.json and merge to main.
# On main, this workflow publishes the version if npm does not have it yet and
# does nothing otherwise. Pre-release versions (1.2.0-beta.1) go to the "next"
# dist-tag, everything else to "latest". Pull requests build, test and pack
# the package without publishing. Running it by hand on main retries a publish.
#
# Authentication: npm trusted publishing (this workflow's GitHub OIDC
# identity, configured on npmjs.com for Weftsh/sandy and npm.yml). The
# NPM_TOKEN secret, if present, is a fallback; npm tries OIDC first.
# Published versions are never overwritten.
name: npm

on:
  push:
    branches: [main]
    paths: ["packages/sdk/**", ".github/workflows/npm.yml"]
  pull_request:
    paths: ["packages/sdk/**", ".github/workflows/npm.yml"]
  workflow_dispatch:

permissions: {}

# Publishes run one at a time; a queued run finds the version already out.
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @weftsh/sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      id-token: write # npm provenance
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @weftsh/sandbox run build
          pnpm --filter @weftsh/sandbox run typecheck
          pnpm --filter @weftsh/sandbox test

      - name: Pack
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Check the version
        id: version
        working-directory: packages/sdk
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          # Ask the registry directly: only a 404 means "not published".
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            "https://registry.npmjs.org/@weftsh%2fsandbox/${version}")"
          case "$status" in
            200)
              echo "::notice::@weftsh/sandbox@${version} is already on npm; nothing to publish"
              new=false ;;
            404)
              echo "@weftsh/sandbox@${version} is not on npm yet (dist-tag ${tag})"
              new=true ;;
            *)
              echo "::error::npm registry answered HTTP ${status}"
              exit 1 ;;
          esac
          { echo "version=${version}"; echo "tag=${tag}"; echo "new=${new}"; } >>"$GITHUB_OUTPUT"

      # The exchange npm performs before publishing: this workflow's GitHub
      # OIDC token for a short-lived npm publish token. It succeeds only if
      # npmjs.com trusts this repository and workflow, so trusted publishing
      # is checked on every run on main, including runs with nothing to
      # publish. The npm token is discarded unread.
      - name: Check trusted publishing
        if: env.PUBLISH == 'true'
        run: |
          id_token="$(curl -sS -f -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "::add-mask::$id_token"
          status="$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@weftsh%2fsandbox")"
          if [ "${status:0:1}" != 2 ]; then
            echo "::error::npm trusted publishing is not set up for this workflow (HTTP ${status})"
            jq -r '.error // .message // empty' "$RUNNER_TEMP/exchange.json" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/exchange.json"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/exchange.json"
          echo "npm accepts this workflow as a trusted publisher of @weftsh/sandbox"

      - name: Publish
        if: env.PUBLISH == 'true' && steps.version.outputs.new == 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later; Node.js 22 ships npm 10.
          npm install -g --no-fund --no-audit npm@11.20.0
          npm --version
          npm publish --provenance --tag "$TAG"
